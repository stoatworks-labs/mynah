<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mynah</title>
    <style>
      body {
        font: 12px/1.5 -apple-system, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        background: #2d2d2d;
        color: #d8d8d8;
      }
      label { display: block; margin-bottom: 10px; }
      span { display: block; margin-bottom: 3px; color: #969696; font-size: 11px; }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #3d3d3d;
        border: 1px solid #4a4a4a;
        border-radius: 3px;
        color: #efefef;
        padding: 5px 7px;
        font: inherit;
      }
      #preview { font-size: 11px; min-height: 2.6em; }
      .ok { color: #6cc47f; }
      .bad { color: #e06c6c; }
      code { color: #969696; }
    </style>
  </head>
  <body>
    <label>
      <span>Device</span>
      <input id="host" placeholder="192.168.2.142" />
    </label>
    <label>
      <span>Port — 80 on a device, 3000 on the simulator</span>
      <input id="port" inputmode="numeric" placeholder="80" />
    </label>
    <label>
      <span>Command</span>
      <input id="command" placeholder="Recall Screen 1 Memory 5" />
    </label>
    <div id="preview"></div>
    <script src="inspector.js"></script>
  </body>
</html>
