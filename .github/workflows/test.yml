name: test

# The grammar and the store scanner are pinned by unit tests; the build is what
# proves the app still compiles. Neither needs a device.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run build
      - name: Build the Stream Deck plugin
        run: npm run build:streamdeck
