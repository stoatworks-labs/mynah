<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mynah — LivePremier command line</title>
    <meta
      name="description"
      content="A lighting-desk command line for Analog Way LivePremier switchers. Type Store, Recall and Take instead of hunting for a button."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Support footer. Vendored from stoatworks-backend/support-footer — edit it
      there and re-run scripts/sync-support-footer.sh, never here.
      Classic + defer on purpose: it reads its config off this tag, and
      document.currentScript is null inside a module.
    -->
    <script
      src="/support-footer.js"
      defer
      data-app="Mynah"
      data-repo="https://github.com/stoatworks-labs/mynah"
      data-version="__APP_VERSION__"
      data-project="mynah"
      data-note="It runs entirely in your browser and talks to the switcher directly — there is no backend, and no show data is uploaded."
    ></script>
  </body>
</html>
