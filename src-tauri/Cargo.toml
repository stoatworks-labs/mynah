[package]
name = "mynah"
version = "1.1.0"
description = "A lighting-desk command line for Analog Way LivePremier switchers"
authors = ["Allan Sargeant"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix is not redundant: it keeps the lib name distinct from the
# bin name, which otherwise collides on Windows.
name = "mynah_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
